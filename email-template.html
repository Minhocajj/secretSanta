<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <title>Secret Santa</title>
  </head>
  <body style="margin: 0; padding: 0; background-color: #123b2c;">
    <div style="display: none; max-height: 0; overflow: hidden; opacity: 0; color: #123b2c;">
      Your Secret Santa match is inside. Keep it secret.
    </div>
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" bgcolor="#123b2c" style="background-color: #123b2c;">
      <tr>
        <td align="center" style="padding: 28px 12px;">
          <table role="presentation" width="560" cellspacing="0" cellpadding="0" border="0" style="width: 100%; max-width: 560px;">
            <tr>
              <td align="center" bgcolor="#c8372d" style="background-color: #c8372d; border-bottom: 4px solid #f2c14e; border-radius: 16px 16px 0 0; padding: 26px 24px; font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; font-size: 28px; font-weight: 700; line-height: 1.2; color: #ffffff;">
                Secret Santa
              </td>
            </tr>
            <tr>
              <td bgcolor="#fffdf8" style="background-color: #fffdf8; border-radius: 0 0 16px 16px; padding: 28px 28px 24px 28px; font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; color: #1f2a24;">
                <p style="margin: 0 0 16px 0; font-size: 20px; font-weight: 700; line-height: 1.3; color: #1f2a24;">
                  Hi {{to_name}},
                </p>
                <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0">
                  <tr>
                    <td bgcolor="#eef6f0" style="background-color: #eef6f0; border-left: 4px solid #1f7a4a; border-radius: 8px; padding: 16px 18px; font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; font-size: 16px; line-height: 1.6; color: #1f2a24;">
                      <div style="white-space: pre-line;">{{message}}</div>
                    </td>
                  </tr>
                </table>
                <p style="margin: 20px 0 0 0; font-size: 15px; line-height: 1.5; color: #5b6a61;">
                  Keep it a secret until the gift exchange.
                </p>
              </td>
            </tr>
            <tr>
              <td align="center" style="padding: 16px 12px 0 12px; font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; font-size: 12px; line-height: 1.5; color: #f2c14e;">
                Sent by Secret Santa
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
